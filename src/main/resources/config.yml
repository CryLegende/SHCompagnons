# SHCompagnons : compagnons qui accompagnent leur propriétaire. Chaque compagnon est un modèle d'entités
# d'affichage (item_display, block_display, text_display) qui n'existe que chez les joueurs, envoyé en paquets :
# aucune entité côté serveur. Le client déplace le modèle avec le joueur et anime les transitions lui-même ; le
# serveur n'envoie que l'orientation quand le joueur tourne la tête, les images clés des animations et les
# changements de texture. Le compagnon choisi est enregistré en base et recréé à chaque connexion.
#
# Commandes (alias /shc, /compagnons) :
#   /shcompagnons set <joueur> <type>              donne un compagnon à un joueur              shcompagnons.admin.set
#   /shcompagnons unset <joueur>                   retire le compagnon d'un joueur             shcompagnons.admin.unset
#   /shcompagnons preview <type> [secondes]        essaie un compagnon sur soi (30 s par défaut),
#                                                  sans rien enregistrer                       shcompagnons.admin.preview
#   /shcompagnons models                           liste les modèles importés et leur taille   shcompagnons.admin.reload
#   /shcompagnons reload                           recharge config.yml, messages.yml, models/  shcompagnons.admin.reload
#   /shcompagnons info <joueur>                    compagnon enregistré en base pour un joueur shcompagnons.admin.info
#   Sans argument, /shcompagnons affiche les sous-commandes que vous pouvez utiliser. Tout marche depuis la console
#   sauf preview. shcompagnons.admin donne toutes les sous-commandes.
#
# reload : si config.yml ou messages.yml est invalide, ou si config.yml ne définit plus aucun compagnon, rien n'est
# remplacé et le message donne le fichier et l'erreur. Le compagnon d'un joueur dont le type a disparu est retiré de
# sa vue, mais reste en base (nettoyé à sa prochaine connexion). La base (database) et reseau.actif demandent un
# redémarrage.
#
# Clic sur son compagnon : le joueur qui vise son compagnon et clique le fait sauter, avec un son, une particule et
# une phrase (companion_settings.click, phrases dans messages.yml). Accroupi, le compagnon ne tourne plus avec le
# regard : le joueur peut se tourner vers lui, et le compagnon se tourne alors vers le joueur.
#
# Placeholders : %shcompagnons_current_pet_type%, %shcompagnons_current_pet_displayname%.
# Messages : messages.yml.
#
# ----------------------------------------------------------------------------------------------------------------
# Importer un modèle de block-display.com
# ----------------------------------------------------------------------------------------------------------------
#   1. Ouvrir la page du modèle (https://block-display.com/browse), attendre que l'aperçu 3D soit chargé, puis
#      cliquer « Get the command ». La fenêtre « Export to Minecraft » s'ouvre.
#   2. Garder les réglages par défaut : Export type « Model only », Command version « Minecraft 26.3 »,
#      Command format « Command Block » (pas Axiom).
#   3. Cliquer « Copy » sur la ligne « Summon #1 » et coller la commande dans plugins/SHCompagnons/models/<nom>.txt.
#      Un gros modèle a plusieurs lignes (« Summon #2 », « Summon #3 »…) : les coller toutes, une par ligne, dans
#      l'ordre. Les lignes « Remove … » (/kill) ne servent pas ; collées par erreur, elles sont ignorées. Une ligne
#      qui commence par # est un commentaire (pratique pour noter l'auteur et le lien du modèle).
#   4. /shcompagnons reload puis /shcompagnons models : le modèle apparaît avec son nombre d'entités et sa taille
#      d'origine en blocs. S'il manque, la console dit pourquoi (aucune commande /summon, commande illisible…).
#   5. Ajouter le compagnon dans pets (en bas du fichier) avec « model: <nom> » (le nom du fichier, sans
#      l'extension) et une échelle : taille en jeu = taille d'origine x placement.scale. Pour comparer, une tête de
#      compagnon fait 0,25 bloc (0,5 x 0,5). Ex : un modèle de 2 blocs de haut à scale 0.2 fait 0,4 bloc.
#   6. /shcompagnons reload puis /shcompagnons preview <type> : le compagnon s'affiche sur soi 30 s, sans rien
#      enregistrer. Ajuster placement (scale, offset, rotation), recharger, revoir. Puis /shcompagnons set.
#
#   Le modèle est recentré tout seul : placement.offset désigne la position de son centre (repère juste en dessous).
#   On peut tourner le modèle dans l'aperçu du site avant « Get the command » : la commande suit. Le déplacer ne
#   change rien, il est recentré.
#   Même chose depuis BDEngine (bdengine.app, menu « Export to Minecraft »). Un fichier .yml de BlockDisplayCreator
#   (display.spawn-command) se dépose tel quel dans models/, un .mcfunction avec des lignes summon aussi.
#   Les animations de BDEngine ne sont pas reprises : seule la pose du modèle compte. Le mouvement du compagnon vient
#   de « animation » et, pour ses pièces, des poses décrites plus bas (« Animer les pièces d'un modèle »).
#   Un modèle dont une entité s'étend sur plus de 64 blocs est refusé : certains modèles du site étirent une tête sur
#   des milliers de blocs pour n'en montrer qu'une face (plans transparents), ils ne peuvent pas servir de compagnon.
#   Coût : chaque entité du modèle est envoyée à chaque joueur qui voit le compagnon, puis chacune reçoit un paquet
#   à chaque fois que le propriétaire tourne la tête et à chaque image clé de l'animation. Un modèle de 10 entités
#   coûte donc 10 fois une tête seule, en permanence. Limite : companion_settings.max_model_parts (12) ; au-delà,
#   le compagnon est refusé au chargement avec un avertissement. Viser 8 ou moins. À nombre égal, un bloc pèse moins
#   qu'une tête à l'apparition (une tête transporte sa texture, que le client télécharge une fois).
#   Sens : le modèle doit regarder vers +z (l'avant du joueur). Beaucoup de modèles du site regardent vers -z ou -x :
#   corriger avec placement.rotation.y (180 ou 90), en plus des -10 du placement par défaut.
#   Modèles fournis : ceux du jar (dossier models/) sont copiés dans plugins/SHCompagnons/models/ quand ils y
#   manquent, jamais remplacés. Pour reprendre un modèle fourni après une mise à jour, supprimer son fichier.
#   Licence : elle est indiquée sur la page du modèle. En BDL BY-NC (usage non commercial), demander à l'auteur avant
#   de vendre ce compagnon en boutique.
#
# ----------------------------------------------------------------------------------------------------------------
# Animer les pièces d'un modèle
# ----------------------------------------------------------------------------------------------------------------
#   Après sa pose de base, un fichier de modèle peut décrire des animations : le même modèle dans d'autres poses, à
#   des instants donnés d'un cycle qui se répète. Seules les entités qui bougent ou changent de texture d'une pose à
#   l'autre sont animées ; le client fait le trajet d'une pose à la suivante.
#
#     /summon block_display ~ ~ ~ {Passengers:[...]}     pose de base : instant 0 de chaque cycle, pose au repos
#     @animation loop=40                                  une animation de 40 ticks, qui se répète
#     @pose 10                                            le modèle entier à l'instant 10 (mêmes entités, même ordre)
#     /summon block_display ~ ~ ~ {Passengers:[...]}
#     @pose 30
#     /summon block_display ~ ~ ~ {Passengers:[...]}
#     @animation loop=120                                 une autre animation, à son propre rythme (un clignement...)
#     @pose 114
#     /summon block_display ~ ~ ~ {Passengers:[...]}
#
#   À la fin du cycle, le modèle revient à la pose de base. Une entité peut bouger dans une animation et changer de
#   texture (ou de bloc) dans une autre. Depuis BDEngine : exporter le même projet dans chaque pose, sans ajouter ni
#   retirer d'élément entre deux exports.
#   Ces animations s'ajoutent à « animation » du compagnon (BOUNCING, GLIDE...) et s'arrêtent comme elle au repos.
#   Un modèle qui fait déjà son saut dans ses poses (les slimes fournis) se déclare avec « animation: NONE ».
#   Coût : un paquet par entité animée à chacune de ses poses, pour chaque joueur qui voit le compagnon ; une entité
#   qui ne change pas dans une animation ne coûte rien. /shcompagnons models donne le nombre d'entités animées.
#
# ----------------------------------------------------------------------------------------------------------------
# Modèles faits dans Blockbench
# ----------------------------------------------------------------------------------------------------------------
#   Un modèle dessiné et animé dans Blockbench (format « Generic Model ») se convertit avec l'atelier du plugin
#   (atelier/blockbench.mjs) : chaque cube devient une tête de joueur étirée qui porte les six faces du cube, sans
#   resource pack. Ses animations deviennent des états, joués selon ce que fait le compagnon :
#     idle       au repos, en boucle
#     walk       quand le compagnon avance (avec son propriétaire, ou de lui-même en mode GROUND), en boucle
#     interact   quand son propriétaire clique sur lui, une fois ; remplace le saut
#   Dans le fichier de modèle, ils suivent la pose de base :
#     @state walk length=12            un état de 12 ticks (« once » à la fin de la ligne : joué une seule fois)
#     @track 3 0:<10 nombres> 6:...    images clés de la pièce n° 3 : tick, puis translation, rotation, échelle
#   D'un état à l'autre, chaque pièce rejoint sa nouvelle pose en 3 ticks. Un compagnon à états se déclare avec
#   « animation: FLOAT » (il flotte à l'épaule ; le flottement s'arrête de lui-même pendant qu'il avance), ou avec
#   « animation: NONE » et « follow: GROUND » pour qu'il marche au sol.
#   Coût : un paquet par pièce à chacune de ses images clés dans l'état joué ; l'atelier l'affiche par état.
#   Une transformation écrite en translation, left_rotation, scale, right_rotation s'anime mieux qu'une transformation
#   en 16 nombres : le client anime ces quatre valeurs séparément.
#
# Un compagnon écrit dans pets mais inutilisable (modèle absent, trop lourd, illisible) n'est pas affiché, et le
# choix des joueurs qui le portent reste en base : il revient dès que le modèle est réparé.
#
# Repère du placement : origine au sommet de la hitbox du joueur (1,8 bloc debout, plus bas accroupi, en nage ou
# en élytre), x vers la gauche du joueur, y vers le haut, z vers l'avant. Le modèle tourne avec le regard du joueur, sauf quand il est accroupi.

# Avec SHNetwork, /shcompagnons set et unset atteignent un joueur connecté sur un autre serveur du réseau : son serveur
# lui donne ou lui retire le compagnon et le prévient. Les serveurs doivent partager la même base (database ci-dessous)
# et la même liste de pets. Sans SHNetwork, ou à false, seuls les joueurs de ce serveur sont atteints.
# Se lit au démarrage.
reseau:
  actif: true

# Base de données : SQLITE (fichier shcompagnons.db) ou MYSQL
database:
  type: "MYSQL"
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "minecraft"
    username: "utilisateur"
    password: "CHANGE_ME"
    useSSL: false
    # Propriétés passées à HikariCP
    properties:
      autoReconnect: true

# Réglages communs à tous les compagnons. placement et follow peuvent être redéfinis par compagnon.
companion_settings:
  # Position du compagnon par défaut (repère décrit en haut du fichier)
  placement:
    # Décalage du centre du modèle (blocs)
    offset:
      x: 0.9
      y: -0.2
      z: -0.3
    # Rotation du modèle sur lui-même (degrés) : y tourne autour de la verticale, x penche en avant, z sur le côté
    rotation:
      y: -10
    # Échelle (1 = taille d'origine ; une tête seule fait 0,5 bloc de côté à 1)
    scale: 0.5

  # ATTACHED : passager du joueur, le client le déplace avec lui à chaque image (aucun paquet de position).
  # FREE : flotte et rattrape le joueur avec un temps de retard (un paquet de position par mise à jour).
  # GROUND : marche au sol derrière le joueur, s'arrête près de lui et le rejoint quand il s'éloigne (un paquet de
  #          position par mise à jour tant qu'il marche, rien à l'arrêt). Le modèle est posé sur ses pieds.
  follow: ATTACHED

  # Mode GROUND
  ground_follow:
    # Distance au joueur (blocs) à laquelle le compagnon s'arrête ; il repart quand le joueur s'éloigne d'un
    # demi-bloc de plus. update_ticks, catch_up et teleport_distance de free_follow valent aussi pour ce mode.
    distance: 1.6

  # Mode FREE
  free_follow:
    # Ticks entre deux positions envoyées ; le client lisse le trajet entre elles
    update_ticks: 2
    # Part de la distance rattrapée à chaque mise à jour (0,01 à 1)
    catch_up: 0.35
    # Au-delà de cette distance (blocs), le compagnon rejoint le joueur directement
    teleport_distance: 16

  # Orientation : envoyée quand le joueur a tourné la tête d'au moins threshold_degrees, au plus une fois tous les
  # min_interval_ticks, et lissée par le client sur smoothing_ticks
  turn:
    threshold_degrees: 2
    min_interval_ticks: 2
    smoothing_ticks: 3
    # Tourner coûte un paquet par entité du modèle. Au-delà de ce nombre d'entités par tick, l'orientation est
    # envoyée moins souvent et lissée plus longtemps (4 : un modèle de 9 à 12 entités tourne tous les 3 ticks)
    max_parts_per_tick: 4
    # Accroupi, le compagnon garde son orientation : le joueur peut se retourner pour le regarder. En mode FREE seule
    # l'orientation est figée, la position suit toujours. false : le compagnon suit toujours le regard.
    freeze_when_sneaking: true
    # Accroupi, quand le joueur tourne son regard vers son compagnon, celui-ci se tourne vers lui et lui fait face
    # tant qu'il le regarde ; il reprend sa place dès que le joueur regarde ailleurs ou se relève.
    face_owner_when_watched: true
    # Au relevé, le compagnon reprend le regard du joueur en autant de ticks (mode ATTACHED ; en mode FREE il le
    # rattrape par paliers). 0 : même lissage que d'habitude (smoothing_ticks).
    resume_smoothing_ticks: 8

  # Repos : quand le propriétaire n'a ni bougé ni tourné la tête depuis ce nombre de secondes, son compagnon revient
  # à sa position neutre et arrête son animation ; il repart au premier mouvement. Un joueur absent ne coûte alors
  # plus aucun paquet à ceux qui le voient. 0 : jamais de repos.
  rest_after_seconds: 30

  # Nombre maximal d'entités d'un modèle importé ; un compagnon dont le modèle dépasse est refusé au chargement
  max_model_parts: 12

  # Le propriétaire voit son propre compagnon
  show_to_owner: true

  # Propriétaire invisible (potion, effet WorldGuard, autre plugin) : son compagnon l'est aussi pour tous les autres et
  # revient avec lui. true : le propriétaire garde son compagnon (comme son propre corps translucide) ; false : il ne
  # le voit plus non plus. Sans effet si show_to_owner est false.
  show_to_owner_when_invisible: true

  # Délai avant d'afficher le compagnon d'un joueur qui se connecte (ticks)
  join_delay_ticks: 20

  # Préchargement des textures (ticks). Un client télécharge la texture d'une tête la première fois qu'il l'affiche et
  # montre une tête par défaut en attendant. Le compagnon apparaît donc d'abord réduit à un point pendant ce délai,
  # le temps de télécharger ses textures et celles que ses animations afficheront, puis se déploie. Le délai s'allonge
  # tout seul pour un modèle qui a beaucoup de textures successives. 0 : le compagnon apparaît aussitôt.
  preload_ticks: 12

  # Clic du propriétaire sur son compagnon. Le compagnon n'a pas de hitbox : le clic compte quand le regard du
  # joueur passe sur le modèle, à portée de main. Clic gauche toujours ; clic droit seulement avec un objet en main
  # ou un bloc visé (sans cela le client n'envoie rien). Le saut est vu de tous, le son et la phrase du joueur seul.
  click:
    enabled: true
    # Délai minimal entre deux réactions (ticks, 20 = 1 seconde ; jamais moins que la durée du saut, 14 ticks)
    cooldown_ticks: 40
    # Hauteur du saut (blocs) ; un petit rebond le suit. 0 : pas de saut.
    hop_height: 0.22
    # Marge autour du modèle pour le viser plus facilement (blocs)
    aim_margin: 0.1
    # Son joué au propriétaire, à la place du compagnon : nom du son dans le jeu (ex : entity.pig.ambient), celui de
    # la commande /playsound. Le « click » d'un compagnon le remplace. Vide : aucun son.
    sound: entity.chicken.egg
    volume: 0.5
    # Hauteur du son (0,5 grave à 2 aigu)
    pitch: 1.3
    # Particule au-dessus du compagnon, pour ceux qui le voient (nom Bukkit, ex : HEART, NOTE). Vide : aucune.
    particle: HEART
    # Où s'affiche la phrase (click_phrases de messages.yml) : ACTIONBAR (au-dessus de la barre d'objets) ou CHAT
    message: ACTIONBAR

# Compagnons. La clé (ex : ghast) est celle de /shcompagnons set <joueur> <clé>.
#
#   displayname           nom affiché (codes couleur &)
#   skin                  texture d'une tête de joueur (valeur base64), compagnon = cette tête
#   skins                 plusieurs textures affichées tour à tour : liste de textures, ou de « value » + « skin_update_interval »
#   skin_update_interval  durée d'affichage de chaque texture (ticks), pour toute la liste ; sans durée, la tête garde
#                         sa première texture
#   model                 modèle importé, à la place d'une tête : nom du fichier de models/ sans l'extension
#                         (voir « Importer un modèle de block-display.com » en haut du fichier) ; il peut porter ses
#                         propres animations (voir « Animer les pièces d'un modèle »)
#   animation             NONE, FLOAT (flottement très léger, sans descendre), GLIDE (montée et descente lentes),
#                         BOUNCING (rebond), WOBBLE_SIDE (balancement), GLIDE_WOBBLE (glide + balancement),
#                         SPIN (tour sur lui-même)
#   animation_speed       vitesse de l'animation (1 = normale, 2 = deux fois plus rapide)
#   animation_amplitude   ampleur des mouvements de l'animation (1 = normale)
#   follow                ATTACHED, FREE ou GROUND (voir companion_settings)
#   placement             offset, rotation, scale (voir companion_settings), seules les clés données changent
#   click                 sound, pitch : son du compagnon quand son propriétaire clique dessus (voir
#                         companion_settings.click) ; sound vide : aucun son
#
# Exemple de compagnon importé (fichier models/dragon.txt) :
#   dragon:
#     displayname: "&5Dragon"
#     model: dragon
#     animation: GLIDE
#     follow: FREE
#     placement:
#       scale: 0.25
pets:
  ghast:
    displayname: "Ghast"
    animation: FLOAT
    model: ghast
    click:
      sound: entity.ghast.ambient
      pitch: 1.8
    placement:
      scale: 0.39
  Slime:
    displayname: "Slime"
    animation: FLOAT
    model: slime
    click:
      sound: entity.slime.squish_small
      pitch: 1.0
  # Les modèles faits dans Blockbench (tous sauf Steve, Alex, Zombie, R2-D2 et Golem de cuivre) flottent à l'épaule, avec leurs états idle, walk et interact
    placement:
      scale: 0.39
  Capybara:
    displayname: "Capybara"
    animation: FLOAT
    model: capybara
    click:
      sound: entity.item.pickup
      pitch: 0.8
  # Compagnons d'évènement, hors box cosmétique : leur modèle porte le nom de l'évènement (halloween_, paques_, ete_)
    placement:
      scale: 0.37
  Araignee:
    displayname: "Araignée"
    animation: FLOAT
    model: halloween_araignee
    click:
      sound: entity.spider.ambient
      pitch: 1.5
    placement:
      scale: 0.45