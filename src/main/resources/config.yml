# SHCompagnons : compagnons visuels (têtes de joueur portées par un porte-armure invisible, en paquets) qui suivent
# leur propriétaire. Le compagnon choisi est enregistré en base et recréé à chaque connexion.
#
# Commandes (alias /shc, /compagnons) :
#   /shcompagnons set <joueur> <type>   donne un compagnon à un joueur      shcompagnons.admin.set
#   /shcompagnons unset <joueur>         retire le compagnon d'un joueur    shcompagnons.admin.unset
#   /shcompagnons reload                 recharge config.yml et messages.yml  shcompagnons.admin.reload
#   /shcompagnons help                   aide                                 shcompagnons.admin
#
# Messages : messages.yml.

# Base de données : SQLITE (fichier shcompagnons.db) ou MYSQL
database:
  type: "MYSQL"
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "Cosmetiques"
    username: "utilisateur"
    password: "CHANGE_ME"
    useSSL: false
    # Propriétés passées à HikariCP
    properties:
      autoReconnect: true
    #   cachePrepStmts: true
    #   prepStmtCacheSize: 250
    #   prepStmtCacheSqlLimit: 2048
    #   useServerPrepStmts: true
    #   useLocalSessionState: true
    #   rewriteBatchedStatements: true
    #   cacheResultSetMetadata: true
    #   cacheServerConfiguration: true
    #   elideSetAutoCommits: true
    #   maintainTimeStats: false

# Placement et mouvement des compagnons
companion_settings:
  # Hauteur du porte-armure par rapport aux pieds du joueur (blocs)
  armorstand_base_vertical_offset: 0.6
  # Pose du bras droit qui tient la tête (degrés)
  right_arm_pose_degrees:
    x: -45
    y: 45
    z: 0

  # Orientation du compagnon par rapport au regard du joueur (degrés)
  # 0 = même direction, 90 = vers la droite, -90 = vers la gauche, 180 = face au joueur
  armorstand_yaw_offset_degrees: 190.0

  # Part de l'écart rattrapée à chaque tick (1 = colle au joueur)
  follow_speed: 1
  # Au-delà de cette distance au carré (blocs²), le compagnon est téléporté au lieu de glisser
  max_distance_before_teleport_squared: 225

# Configuration des pets
# Vous pouvez ajouter autant de pets que vous voulez ici.
