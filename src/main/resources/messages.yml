# Messages de SHCompagnons. Codes couleur avec &.
# Placeholders :
#   {prefix} - le préfixe ci-dessous
#   {player} - joueur cible (commandes admin)
#   {pet_type_key} - clé du type de compagnon (ex : ghast)
#   {pet_display_name} - nom affiché du compagnon
#   {types_list} - liste des types disponibles
#   {command_label} - nom canonique de la commande (shcompagnons)
#   {subcommands} - sous-commandes permises à l'expéditeur
#   {file} {error} - fichier refusé par reload et cause
#   {plugin_version} - version du plugin
#   {seconds} - durée d'un aperçu (secondes)
#   {pets} / {models} - nombre de compagnons / de modèles chargés
#   {count} - nombre de modèles importés
#   {model} {parts} {x} {y} {z} - nom, nombre d'entités et taille (blocs) d'un modèle importé
# Un message vide ("") n'est pas envoyé.

# Préfixe ajouté devant les messages (vide : aucun)
prefix: "&7&l« &6&lSH &8&l» "

# Joueur qui reçoit ou perd un compagnon
pet_equipped: ""
pet_removed: ""
pet_save_error: "{prefix}&cErreur lors de la sauvegarde de votre compagnon."
pet_remove_db_error: "{prefix}&cErreur lors du retrait de votre compagnon de la base de données."
pet_type_no_longer_available_on_reload: "{prefix}&eVotre ancien type de compagnon n'est plus disponible et a été retiré."

# Celui qui exécute les commandes admin
admin_no_permission_command: "&8&l« &f&lSH &8&l» &fCommande inconnue, essayer autre chose."
admin_no_permission_subcommand: "&8&l« &f&lSH &8&l» &fCommande inconnue, essayer autre chose."
admin_usage_set: "{prefix}&cUsage: /{command_label} set <joueur> <type_pet>"
admin_usage_unset: "{prefix}&cUsage: /{command_label} unset <joueur>"
admin_usage_preview: "{prefix}&cUsage (en jeu) : /{command_label} preview <type_pet> [secondes]"
admin_preview_start: "{prefix}&7Aperçu de {pet_display_name}&7 pendant &f{seconds} s&7, rien n'est enregistré."
admin_models_empty: "{prefix}&7Aucun modèle dans &fplugins/SHCompagnons/models/&7."
admin_models_header: "{prefix}&7{count} modèle(s) importé(s) :"
admin_models_line: " &8• &f{model} &7: {parts} entités, {x} x {y} x {z} blocs"
admin_player_not_online: "{prefix}&cLe joueur '{player}' n'est pas en ligne ou n'existe pas."
admin_pet_type_not_exists: "{prefix}&cLe type de compagnon '{pet_type_key}' n'existe pas."
admin_available_types_info: "&7Types disponibles: {types_list}"
admin_pet_set_success: "{prefix}&aLe compagnon {pet_display_name}&a a été défini pour {player}."
admin_player_no_pet_to_unset: "{prefix}&e{player} n'a pas de compagnon actif ou enregistré à retirer."
admin_pet_unset_success: "{prefix}&aLe compagnon de {player} a été retiré (s'il en avait un)."
admin_reload_start: "{prefix}&eRechargement de la configuration de SHCompagnons..."
admin_reload_success: "{prefix}&aSHCompagnons rechargé : {pets} compagnons, {models} modèles."

# /shcompagnons sans argument ou avec une sous-commande inconnue : une seule ligne, sous-commandes permises
admin_usage: "{prefix}&7Utilisation : &c/shcompagnons <{subcommands}>"
admin_usage_info: "{prefix}&cUsage: /{command_label} info <joueur>"
admin_info_line: "{prefix}&7Compagnon de &f{player}&7 : &f{pet_type_key} &7({pet_display_name}&7)."
admin_info_none: "{prefix}&e{player} n'a pas de compagnon enregistré."
admin_info_unknown_type: "{prefix}&e{player} a le compagnon &f{pet_type_key}&e en base, absent de config.yml."
admin_info_error: "{prefix}&cLecture de la base impossible, voir la console."
admin_reload_error: "{prefix}&cRechargement refusé ({file} : {error}). La configuration précédente est conservée."
admin_reload_no_pets: "{prefix}&cRechargement refusé : config.yml ne définit aucun compagnon. La configuration précédente est conservée."
admin_reload_restart: "{prefix}&7La base de données (&fdatabase&7) et &freseau.actif&7 ne se rechargent qu'au redémarrage."
