name: SHCompagnons
version: '${project.version}'
main: org.Cry_Legende.sHCompagnons.SHCompagnons
api-version: '1.20'
author: Cry_Legende
description: Compagnons en entités d'affichage envoyées par paquets, déplacés et animés par le client.
depend: [packetevents]
# SHNetwork est facultatif : sans lui, /shcompagnons set et /shcompagnons unset ne touchent que les joueurs de ce serveur.
softdepend: [PlaceholderAPI, SHNetwork]

commands:
  shcompagnons:
    description: Administration de SHCompagnons.
    aliases: [shc, compagnons]
    permission: shcompagnons.admin.set;shcompagnons.admin.unset;shcompagnons.admin.preview;shcompagnons.admin.reload;shcompagnons.admin.info
    usage: |
      /shcompagnons set <joueur> <type_pet>
      /shcompagnons unset <joueur>
      /shcompagnons preview <type_pet> [secondes]
      /shcompagnons models
      /shcompagnons reload
      /shcompagnons info <joueur>

permissions:
  shcompagnons.admin:
    description: Toutes les sous-commandes de /shcompagnons.
    default: op
    children:
      shcompagnons.admin.set: true
      shcompagnons.admin.unset: true
      shcompagnons.admin.preview: true
      shcompagnons.admin.reload: true
      shcompagnons.admin.info: true
  shcompagnons.admin.set:
    description: Définir un compagnon à un joueur avec /shcompagnons set.
    default: op
  shcompagnons.admin.unset:
    description: Retirer le compagnon d'un joueur avec /shcompagnons unset.
    default: op
  shcompagnons.admin.preview:
    description: Essayer un compagnon sur soi sans l'enregistrer avec /shcompagnons preview.
    default: op
  shcompagnons.admin.reload:
    description: Recharger la configuration avec /shcompagnons reload et lister les modèles importés avec /shcompagnons models.
    default: op
  shcompagnons.admin.info:
    description: Voir le compagnon enregistré d'un joueur avec /shcompagnons info.
    default: op
