name: SHCompagnons
version: '${project.version}'
main: org.Cry_Legende.sHCompagnons.SHCompagnons
api-version: '1.20'
author: Cry_Legende
description: Compagnons en entités d'affichage envoyées par paquets, déplacés et animés par le client.
depend: [packetevents]
# SHNetwork est facultatif : sans lui, /shc set et /shc unset ne touchent que les joueurs de ce serveur.
softdepend: [PlaceholderAPI, SHNetwork]

commands:
  shcompagnons:
    description: Commande principale du plugin SHCompagnons.
    aliases: [shc, compagnons]
    permission: shcompagnons.admin
    usage: |
      /shcompagnons set <joueur> <type_pet>
      /shcompagnons unset <joueur>
      /shcompagnons preview <type_pet> [secondes]
      /shcompagnons models
      /shcompagnons reload

permissions:
  shcompagnons.admin:
    description: Donne accès à toutes les commandes de SHCompagnons.
    default: op
  shcompagnons.admin.set:
    description: Permet de définir un compagnon à un joueur.
    default: op
  shcompagnons.admin.unset:
    description: Permet de retirer le compagnon d'un joueur.
    default: op
  shcompagnons.admin.preview:
    description: Permet d'essayer un compagnon sur soi sans l'enregistrer.
    default: op
  shcompagnons.admin.reload:
    description: Permet de recharger la configuration et de lister les modèles importés.
    default: op
