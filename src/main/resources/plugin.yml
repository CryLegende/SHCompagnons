name: SHCompagnons
version: '${project.version}'
main: org.Cry_Legende.sHCompagnons.SHCompagnons
api-version: '1.20'
author: Cry_Legende
description: Plugin de compagnons packet-based pour Minecraft.
depend: [ProtocolLib]
softdepend: [PlaceholderAPI]

commands:
  shcompagnons:
    description: Commande principale du plugin SHCompagnons.
    aliases: [shc, compagnons]
    permission: shcompagnons.admin
    usage: |
      /shcompagnons set <joueur> <type_pet>
      /shcompagnons unset <joueur>
      /shcompagnons reload

permissions:
  shcompagnons.admin:
    description: Donne accès à toutes les commandes de SHCompagnons.
    default: op
  shcompagnons.admin.set:
    description: Permet de définir un compagnon à un joueur.
    default: op
  shcompagnons.admin.unset:
    description: Permet de retirer le compagnon d'un joueur.
    default: op
  shcompagnons.admin.reload:
    description: Permet de recharger la configuration du plugin.
    default: op
